name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [18.x, 22.x]
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ext .js --ignore-pattern node_modules --ignore-pattern dist

      - name: Unit tests
        run: npx jest __tests__/unit/ --verbose

      - name: Property tests
        run: npx jest __tests__/properties/ --verbose

      - name: Integration tests
        run: npx jest __tests__/integration/ --verbose

      - name: E2E tests
        run: npx jest __tests__/e2e/ --verbose
